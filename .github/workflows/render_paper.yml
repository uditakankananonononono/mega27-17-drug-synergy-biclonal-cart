name: Render Lane A paper PDF
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render_paper.yml'
      - 'paper/main.tex'
permissions:
  contents: write
concurrency:
  group: render-paper
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: texlive/texlive:latest   # TeX preinstalled; no apt step (apt stalled in the sister repo)
    steps:
      - uses: actions/checkout@v4
      - name: Render (xelatex, 3 passes)
        working-directory: paper
        run: |
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          pdfinfo main.pdf | grep Pages || true
      - uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: paper/main.pdf
  commit:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: main-pdf
          path: paper
      - name: Commit rendered PDF
        run: |
          set -x
          git config user.name 'github-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add -f paper/main.pdf
          git status --short
          if git diff --cached --quiet; then echo "PDF unchanged"; exit 0; fi
          git commit -m 'CI: render paper/main.pdf from main.tex (xelatex, texlive container)'
          git push origin HEAD:main

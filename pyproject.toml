[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cart-target-rank"
version = "0.1.0"
description = "Rank CAR-T targets by FANM/percentile tumor-vs-normal window (HPA + TCGA per-sample)"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas"]

[project.scripts]
cart-target-rank = "cart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
